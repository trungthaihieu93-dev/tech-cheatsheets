<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which layer owns the behavior?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which layer owns the behavior?</text><path d="M480,180 L480,205" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="436.0" y="166.5" width="88" height="24" rx="4" fill="#FFFEF7"/><text x="480.0" y="183.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">builds on</text><path d="M480,295 L480,320" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="444.0" y="281.5" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="480.0" y="298.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">runs on</text><path d="M260,135 L370,135" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="267.0" y="61" width="96" height="24" rx="4" fill="#FFFEF7"/><text x="315.0" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">integrates</text><rect x="370" y="320" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="480" y="355" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Java / JVM</text><text x="480" y="378" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">language + runtime</text><rect x="370" y="205" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="480" y="233" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Spring Framework</text><text x="480" y="256" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">container +</text><text x="480" y="279" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">infrastructure</text><rect x="370" y="90" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="480" y="118" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Spring Boot</text><text x="480" y="141" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">assembly +</text><text x="480" y="164" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">configuration</text><rect x="40" y="90" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="150" y="118" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Portfolio projects</text><text x="150" y="141" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">Data / Security /</text><text x="150" y="164" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">Cloud</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Layer arrows mean builds on or integrates with; they are not the path of an HTTP request.</text></svg>