<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Where should concurrency be limited?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Where should concurrency be limited?</text><path d="M260,200 L365,200" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="256.5" y="126" width="112" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="143" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">request slot</text><path d="M585,200 L690,200" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577.5" y="126" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="143" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">admitted work</text><path d="M475,245 L475,315" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="399.0" y="254.0" width="152" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="271.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">no slot available</text><rect x="40" y="155" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="190" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Many tasks</text><text x="150" y="213" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">virtual threads</text><rect x="365" y="155" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="190" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Semaphore</text><text x="475" y="213" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">bounded admission</text><rect x="690" y="155" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="800" y="190" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">DB / insurer</text><text x="800" y="213" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">scarce capacity</text><rect x="365" y="315" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="350" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Waiting tasks</text><text x="475" y="373" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">do not consume slots</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Limit the scarce downstream resource. The figure illustrates admission control, not virtual-thread</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">scheduling internals.</text></svg>