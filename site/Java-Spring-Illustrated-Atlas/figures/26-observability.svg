<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which signal answers which question?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which signal answers which question?</text><path d="M260,155 L365,155" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268.5" y="81" width="88" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="98" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">aggregate</text><path d="M150,200 L150,235 L800,235 L800,200" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="431.0" y="212" width="88" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="229" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">correlate</text><rect x="40" y="110" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">HTTP operation</text><text x="150" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">named observation</text><rect x="365" y="110" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Metrics</text><text x="475" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">bounded dimensions</text><rect x="690" y="110" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Trace spans</text><text x="800" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">request causality</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="328" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Actuator endpoints</text><text x="475" y="351" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">health + operational</text><text x="475" y="374" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">access</text><rect x="690" y="300" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="800" y="328" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Runtime recording</text><text x="800" y="351" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">CPU / locks /</text><text x="800" y="374" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">allocation</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Metrics aggregate, traces connect work, runtime recordings explain JVM behavior. Endpoint exposure is a</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">separate security decision.</text></svg>