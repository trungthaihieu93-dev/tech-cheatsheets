amily="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Client</text><text x="150" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">broker portal</text><rect x="365" y="110" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Gateway</text><text x="475" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">routing policies</text><rect x="690" y="110" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Application service</text><text x="800" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">domain use case</text><rect x="690" y="300" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Insurer service</text><text x="800" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">HTTP contract</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Configuration source</text><text x="475" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">operational settings</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Illustrative deployment, not a mandatory Cloud stack. Compatibility is governed by the selected release</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-