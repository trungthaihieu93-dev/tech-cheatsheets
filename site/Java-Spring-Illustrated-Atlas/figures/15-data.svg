<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Where does repository abstraction stop?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Where does repository abstraction stop?</text><path d="M365,145 L260,330" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="248.5" y="211.5" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="228.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">implementation</text><path d="M475,190 L475,285" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="411.0" y="211.5" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="228.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">implementation</text><path d="M150,375 L150,410 L800,410 L800,375" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="439.0" y="387" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="404" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">queries</text><path d="M585,330 L690,330" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="601.5" y="256" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="273" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">queries</text><rect x="365" y="100" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="475" y="128" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Repository contract</text><text x="475" y="151" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">query + aggregate</text><text x="475" y="174" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">intent</text><rect x="40" y="285" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="150" y="313" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">JPA model</text><text x="150" y="336" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">context +</text><text x="150" y="359" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">relationships</text><rect x="365" y="285" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="475" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">JDBC model</text><text x="475" y="343" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">explicit aggregates</text><rect x="690" y="285" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Actual database</text><text x="800" y="343" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">SQL + indexes + rows</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">JPA and JDBC are alternatives shown together for comparison. They do not share a persistence context.</text></svg>