<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Why was an infrastructure bean created?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Why was an infrastructure bean created?</text><path d="M260,155 L365,335" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="240.5" y="219.0" width="144" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="236.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">class conditions</text><path d="M475,200 L475,290" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="391.0" y="219.0" width="168" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="236.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">property conditions</text><path d="M690,155 L585,335" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="569.5" y="219.0" width="136" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="236.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">bean conditions</text><rect x="40" y="110" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Classpath</text><text x="150" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">libraries present?</text><rect x="365" y="110" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#