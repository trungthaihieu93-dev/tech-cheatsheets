<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Why can a final reference still change?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Why can a final reference still change?</text><path d="M260,160 L365,325" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="283.5" y="216.5" width="58" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="233.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">alias</text><path d="M690,160 L585,325" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="608.5" y="216.5" width="58" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="233.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">alias</text><rect x="40" y="115" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Reference A</text><text x="150" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">points to a list</text><rect x="690" y="115" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="800" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Reference B</text><text x="800" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">points to same list</text><rect x="365" y="280" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="315" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Mutable list</text><text x="475" y="338" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">shared object</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Reference identity and object state are different; defensive copies break unwanted sharing.</text></svg>