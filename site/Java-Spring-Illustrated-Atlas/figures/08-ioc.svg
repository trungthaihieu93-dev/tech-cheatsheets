<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Who creates and connects collaborators?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Who creates and connects collaborators?</text><path d="M365,140 L260,330" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="268.5" y="209.0" width="88" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="226.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">construct</text><path d="M475,185 L475,285" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="431.0" y="209.0" width="88" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="226.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">construct</text><path d="M260,330 L365,330" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="240.5" y="256" width="144" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="273" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">inject reference</text><rect x="365" y="95" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="475" y="130" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">ApplicationContext</text><text x="475" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">bean definitions</text><rect x="40" y="285" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="150" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Pricing adapter</text><text x="150" y="343" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">implements PricingPort</text><rect x="365" y="285" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="475" y="320" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">QuoteService</text><text x="475" y="343" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">requires PricingPort</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Arrows distinguish construction from injecting an existing collaborator. Business calls are omitted.</text></svg>