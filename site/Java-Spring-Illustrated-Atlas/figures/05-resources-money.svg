<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>What must be explicit at a boundary?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">What must be explicit at a boundary?</text><path d="M260,170 L365,170" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="232.5" y="96" width="160" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="113" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">try-with-resources</text><path d="M585,170 L690,170" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="573.5" y="96" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="113" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">always on exit</text><rect x="40" y="125" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Owner scope</text><text x="150" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">opens resource</text><rect x="365" y="125" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Use resource</text><text x="475" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">success or exception</text><rect x="690" y="125" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">close()</text><text x="800" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">scope exits</text><rect x="365" y="295" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="330" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Money policy</text><text x="475" y="353" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">currency + rounding</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Top: deterministic resource lifetime. Bottom: decimal policy is a separate domain decision.</text></svg>