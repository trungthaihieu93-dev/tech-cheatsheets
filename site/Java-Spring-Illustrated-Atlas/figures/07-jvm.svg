<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>How do execution and evidence connect?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">How do execution and evidence connect?</text><path d="M260,165 L365,165" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="276.5" y="91" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="108" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">execute</text><path d="M585,165 L690,165" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="597.5" y="91" width="80" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="108" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">hot code</text><path d="M475,210 L475,300" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="443.0" y="229.0" width="64" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="246.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">events</text><path d="M260,345 L365,345" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="280.5" y="271" width="64" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="288" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">events</text><rect x="40" y="120" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" f