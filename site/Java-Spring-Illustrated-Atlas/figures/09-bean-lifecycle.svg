<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>When is a bean ready for advised calls?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">When is a bean ready for advised calls?</text><path d="M260,180 L365,180" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="272.5" y="106" width="80" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="123" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">populate</text><path d="M585,180 L690,180" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="581.5" y="106" width="112" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="123" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">post-process</text><path d="M800,225 L800,295" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="728.0" y="234.0" width="144" height="24" rx="4" fill="#FFFEF7"/><text x="800.0" y="251.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">container closes</text><rect x="40" y="135" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="170" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Create bean</text><text x="150" y="193" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">inject dependencies</text><rect x="365" y="135" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="170" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Initialize target</text><text x="475" y="193" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">lifecycle callbacks</text><rect x="690" y="135" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="170" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Expose bean</text><text x="800" y="193" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">possibly proxied</text><rect x="690" y="295" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="330" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Destroy managed bean</text><text x="800" y="353" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">shutdown callbacks</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Typical simplified lifecycle. Prototype destruction and manually created objects require separate</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">ownership.</text></svg>