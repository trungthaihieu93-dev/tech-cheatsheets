<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>When does a stream actually execute?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">When does a stream actually execute?</text><path d="M260,200 L365,200" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="272.5" y="126" width="80" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="143" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">elements</text><path d="M585,200 L690,200" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="553.5" y="126" width="168" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="143" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">evaluated on demand</text><path d="M800,245 L800,300" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="764.0" y="246.5" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="800.0" y="263.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">collect</text><rect x="40" y="155" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="190" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Source</text><text x="150" y="213" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">quotes</text><rect x="365" y="155" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="190" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">filter → map</text><text x="475" y="213" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">lazy transformations</text><rect x="690" y="155" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="190" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">toList()</text><text x="800" y="213" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">terminal traversal</text><rect x="690" y="300" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Result list</text><text x="800" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">materialized values</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">This is a sequential pipeline. Parallel execution requires separate assumptions about side effects and</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">workload.</text></svg>