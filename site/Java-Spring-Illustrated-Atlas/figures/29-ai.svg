<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Who owns authority when the model calls a tool?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Who owns authority when the model calls a tool?</text><path d="M260,155 L365,155" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="272.5" y="81" width="80" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="98" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">retrieve</text><path d="M585,155 L690,155" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="573.5" y="81" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="98" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">augment prompt</text><path d="M800,200 L800,300" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="736.0" y="224.0" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="800.0" y="241.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">requested tool</text><path d="M690,345 L585,345" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="569.5" y="271" width="136" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="288" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">only if allowed</text><rect x="40" y="110" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">User question</text><text x="150" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">authenticated caller</text><rect x="365" y="110" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Authorized retrieval</text><text x="475" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">tenant-scoped context</text><rect x="690" y="110" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Model</text><text x="800" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">answer / tool request</text><rect x="690" y="300" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="800" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Application tool gate</text><text x="800" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">validate + authorize</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Business service</text><text x="475" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">controlled action</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Proposed guarded design grounded in Spring AI mechanisms; application authorization is not supplied by</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">retrieval itself.</text></svg>