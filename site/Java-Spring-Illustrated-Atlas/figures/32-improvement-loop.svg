<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>How does a better service become a proven service?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">How does a better service become a proven service?</text><path d="M260,165 L365,165" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="276.5" y="91" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="108" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">observe</text><path d="M585,165 L690,165" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="601.5" y="91" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="108" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">propose</text><path d="M800,210 L800,300" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="760.0" y="229.0" width="80" height="24" rx="4" fill="#FFFEF7"/><text x="800.0" y="246.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">validate</text><path d="M690,345 L585,345" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="605.5" y="271" width="64" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="288" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">assess</text><path d="M365,345 L260,165" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="256.5" y="229.0" width="112" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="246.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">new baseline</text><rect x="40" y="120" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Baseline</text><text x="150" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">known behavior</text><rect x="365" y="120" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Hypothesis</text><text x="475" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">one named constraint</text><rect x="690" y="120" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">One change</text><text x="800" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">mechanism + cost</text><rect x="690" y="300" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="328" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Measure + fail-test</text><text x="800" y="351" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">correctness +</text><text x="800" y="374" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">operability</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Decision</text><text x="475" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">keep / revise / revert</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">This is an engineering synthesis, not a claim of measured performance gains for the example service.</text></svg>