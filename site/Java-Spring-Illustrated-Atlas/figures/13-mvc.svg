F7"/><text x="637.5" y="241.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">failure</text><rect x="40" y="120" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">DispatcherServlet</text><text x="150" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">route request</text><rect x="365" y="120" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Controller + DTO</text><text x="475" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">validate / translate</text><rect x="690" y="120" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Service</text><text x="800" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">business rules</text><rect x="690" y="290" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Repository</text><text x="800" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">persistence</text><rect x="365" y="290" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Exception handling</text><text x="475" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">ProblemDetail</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Request-side responsibilities; responses return through MVC. Authentication filters normally run before</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">this view.</text></svg>