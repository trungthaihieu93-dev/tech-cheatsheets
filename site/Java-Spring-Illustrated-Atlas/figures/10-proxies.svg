<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which call crosses the proxy boundary?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which call crosses the proxy boundary?</text><path d="M260,170 L365,170" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="252.5" y="96" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="113" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">external call</text><path d="M585,170 L690,170" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="585.5" y="96" width="104" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="113" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">intercepted</text><path d="M800,215 L800,310" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="684.0" y="236.5" width="232" height="24" rx="4" fill="#FFFEF7"/><text x="800.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">this.audit() bypasses proxy</text><rect x="40" y="125" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Caller</text><text x="150" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">managed reference</text><rect x="365" y="125" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Proxy</text><text x="475" y="176" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">transaction / other</text><text x="475" y="199" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">advice</text><rect x="690" y="125" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Target issue()</text><text x="800" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">business operation</text><rect x="690" y="310" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="800" y="345" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Target audit()</text><text x="800" y="368" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">self-invocation</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Default Spring AOP proxy mode. A self-call does not return to the proxy; weaving can behave differently.</text></svg>