<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which collection matches the invariant?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which collection matches the invariant?</text><path d="M365,140 L260,335" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="240.5" y="211.5" width="144" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="228.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">ordered sequence</text><path d="M475,185 L475,290" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="427.0" y="211.5" width="96" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="228.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">uniqueness</text><path d="M585,140 L690,335" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577.5" y="211.5" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="228.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">lookup by key</text><rect x="365" y="95" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="475" y="130" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Requirement</text><text x="475" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">What must stay true?</text><rect x="40" y="290" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="150" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">List</text><text x="150" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">sequence + duplicates</text><rect x="365" y="290" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="475" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Set</text><text x="475" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">unique membership</text><rect x="690" y="290" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Map</text><text x="800" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">key → value</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">These are contracts, not performance rankings. Implementation and workload determine cost.</text></svg>