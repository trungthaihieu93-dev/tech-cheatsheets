<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which test can prove the behavior?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which test can prove the behavior?</text><path d="M260,175 L365,350" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="244.5" y="236.5" width="136" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">rule confidence</text><path d="M475,220 L475,305" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="395.0" y="236.5" width="160" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">binding confidence</text><path d="M690,175 L585,350" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="541.5" y="236.5" width="192" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">persistence confidence</text><rect x="40" y="130" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="165" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Unit test</text><text x="150" y="188" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">rule correctness</text><rect x="365" y="130" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="158" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Slice test</text><text x="475" y="181" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">selected framework</text><text x="475" y="204" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">boundary</text><rect x="690" y="130" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="165" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Integration test</text><text x="800" y="188" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">real infrastructure</text><rect x="365" y="305" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="340" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Critical HTTP flow</text><text x="475" y="363" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">application behavior</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">These are complementary test scopes, not a required execution chain. Full-context does not automatically</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">mean real external services.</text></svg>