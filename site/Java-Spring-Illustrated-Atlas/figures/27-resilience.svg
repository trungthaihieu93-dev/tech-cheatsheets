<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>When does retry improve reliability?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">When does retry improve reliability?</text><path d="M260,155 L365,155" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="283.5" y="81" width="58" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="98" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">admit</text><path d="M585,155 L690,155" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="601.5" y="81" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="98" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">attempt</text><path d="M690,155 L585,345" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="601.5" y="224.0" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="241.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">failure</text><path d="M475,300 L475,200" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="415.0" y="224.0" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="241.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">bounded retry</text><path d="M800,200 L800,300" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="716.0" y="224.0" width="168" height="24" rx="4" fill="#FFFEF7"/><text x="800.0" y="241.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">success / exhausted</text><rect x="40" y="110" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Overall deadline</text><text x="150" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">finite budget</text><rect x="365" y="110" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Concurrency limit</text><text x="475" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">protect dependency</text><rect x="690" y="110" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="145" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Dependency call</text><text x="800" y="168" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">per-attempt timeout</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Retry decision</text><text x="475" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">transient + safe?</text><rect x="690" y="300" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="800" y="328" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Final outcome</text><text x="800" y="351" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">success or explicit</text><text x="800" y="374" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">failure</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Policy sketch, not annotation execution order. Retry and transaction nesting must be chosen deliberately.</text></svg>