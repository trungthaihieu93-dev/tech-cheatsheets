<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>What does the transaction actually protect?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">What does the transaction actually protect?</text><path d="M260,160 L365,160" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="248.5" y="86" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="103" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">invoke service</text><path d="M585,160 L690,160" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="573.5" y="86" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="103" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">method outcome</text><path d="M475,205 L475,300" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="403.0" y="226.5" width="144" height="24" rx="4" fill="#FFFEF7"/><text x="475.0" y="243.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">side effect risk</text><rect x="40" y="115" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Transaction proxy</text><text x="150" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">begin / participate</text><rect x="365" y="115" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Database updates</text><text x="475" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">quote + policy</text><rect x="690" y="115" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Commit or rollback</text><text x="800" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">configured rules</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">External email</text><text x="475" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">outside DB atomicity</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">One database transaction. Reactive transaction context, distributed coordination and propagation need</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">separate treatment.</text></svg>