<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which work remains after a failed chunk?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which work remains after a failed chunk?</text><path d="M260,175 L365,175" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="240.5" y="101" width="144" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="118" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">later processing</text><path d="M585,175 L690,175" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577.5" y="101" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="118" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">new execution</text><path d="M585,345 L690,175" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577.5" y="234.0" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="251.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">restart state</text><rect x="40" y="130" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="150" y="165" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Chunks 1–7</text><text x="150" y="188" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">committed work</text><rect x="365" y="130" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="165" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Chunk 8</text><text x="475" y="188" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">failed / rolled back</text><rect x="690" y="130" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="165" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Restart</text><text x="800" y="188" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">resume per contract</text><rect x="365" y="300" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="475" y="335" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Execution metadata</text><text x="475" y="358" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">saved progress</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Conceptual restart boundary. Stable input, restartable components and durable metadata are required;</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">external effects need idempotency.</text></svg>