<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>How do sessions survive replica changes?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">How do sessions survive replica changes?</text><path d="M260,160 L365,160" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="276.5" y="86" width="72" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="103" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">request</text><path d="M260,160 L365,335" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="256.5" y="221.5" width="112" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="238.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">next request</text><path d="M585,160 L690,255" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="585.5" y="181.5" width="104" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="198.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">load / save</text><path d="M585,335 L690,255" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="585.5" y="269.0" width="104" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">load / save</text><rect x="40" y="115" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Browser</text><text x="150" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">cookie + CSRF token</text><rect x="365" y="115" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">App replica A</text><text x="475" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">session integration</text><rect x="365" y="290" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="475" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">App replica B</text><text x="475" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">session integration</text><rect x="690" y="210" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="245" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Shared session store</text><text x="800" y="268" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">expiry + state</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">A shared session store is an option, not mandatory for every app. CSRF still depends on credential</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">transport.</text></svg>