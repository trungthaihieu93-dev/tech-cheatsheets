e="#18202A" stroke-width="2.2"/><text x="475" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Consumer</text><text x="475" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">process + deduplicate</text><rect x="690" y="125" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="800" y="160" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Business store</text><text x="800" y="183" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">effect + event marker</text><rect x="365" y="305" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="475" y="340" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Acknowledge / commit</text><text x="475" y="363" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">after chosen boundary</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Application-level idempotency sketch; broker protocols and acknowledgement semantics differ.</text></svg>