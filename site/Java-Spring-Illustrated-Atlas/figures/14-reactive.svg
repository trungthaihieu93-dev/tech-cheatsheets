<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img"><title>Which I/O contract fits the execution model?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18202A" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="960" height="490" rx="18" fill="#FFFEF7"/><path d="M35 63 Q340 68 830 61" stroke="#FEF08A" stroke-width="17" fill="none"/><text x="35" y="50" fill="#1E3A8A" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Which I/O contract fits the execution model?</text><path d="M260,160 L365,160" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="248.5" y="86" width="128" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="103" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">imperative I/O</text><path d="M690,160 L585,160" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="577.5" y="86" width="120" height="24" rx="4" fill="#FFFEF7"/><text x="637.5" y="103" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">still bounded</text><path d="M260,335 L365,335" fill="none" stroke="#18202A" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="236.5" y="261" width="152" height="24" rx="4" fill="#FFFEF7"/><text x="312.5" y="278" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18202A">reactive pipeline</text><rect x="40" y="115" width="220" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="150" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">MVC</text><text x="150" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">request execution</text><rect x="365" y="115" width="220" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="475" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Blocking driver</text><text x="475" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">JDBC / JPA</text><rect x="690" y="115" width="220" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="800" y="150" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Virtual threads</text><text x="800" y="173" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">cheap blocking waits</text><rect x="40" y="290" width="220" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="150" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">WebFlux</text><text x="150" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">event-loop processing</text><rect x="365" y="290" width="220" height="90" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="475" y="325" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold">Non-blocking driver</text><text x="475" y="348" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal">async I/O + demand</text><text x="35" y="442" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">Two valid styles; virtual-thread configuration is separate from choosing MVC. No universal performance</text><text x="35" y="463" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#485265">ranking is implied.</text></svg>