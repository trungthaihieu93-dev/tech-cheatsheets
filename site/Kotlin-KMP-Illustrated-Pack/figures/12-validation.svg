<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img"><title>12 / VALIDATE, THEN EXPAND</title><desc>A proposed adoption path; measure before widening scope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#18202A"/></marker></defs><rect width="600" height="650" fill="#FFFEF7"/><path d="M28 28 H560" stroke="#FEF08A" stroke-width="26"/><text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">12 / VALIDATE, THEN EXPAND</text><text x="30" y="70" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">A proposed adoption path; measure before widening scope.</text><rect x="95" y="100" width="410" height="65" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">1 / Common rules + fake ports</text><path d="M300 165 L300 213" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="300.0,213.0 295.5,203.0 304.5,203.0" fill="#18202A"/><rect x="95" y="220" width="410" height="80" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="253.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">2 / Same common tests</text><text x="300.0" y="281.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">on JVM and iOS simulator</text><path d="M300 300 L300 349" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="300.0,349.0 295.5,339.0 304.5,339.0" fill="#18202A"/><rect x="95" y="355" width="410" height="80" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="388.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">3 / Platform + Swift boundary tests</text><text x="300.0" y="416.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">errors, cancel, lifecycle, UI</text><path d="M300 435 L300 480" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="300.0,480.0 295.5,470.0 304.5,470.0" fill="#18202A"/><rect x="95" y="487" width="410" height="60" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="524.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">4 / Release metrics → next feature</text><text x="30" y="602" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="400" fill="#1E3A8A">Passing JVM tests is evidence for JVM behavior only.</text></svg>