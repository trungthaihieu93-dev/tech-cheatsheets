<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img"><title>01 / NULLABILITY IS A CONTRACT</title><desc>What must be handled before a value is used?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#18202A"/></marker></defs><rect width="600" height="480" fill="#FFFEF7"/><path d="M28 28 H560" stroke="#FEF08A" stroke-width="26"/><text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">01 / NULLABILITY IS A CONTRACT</text><text x="30" y="70" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">What must be handled before a value is used?</text><rect x="175" y="100" width="250" height="64" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Input: String?</text><path d="M300 164 L300 206" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="300.0,206.0 295.5,196.0 304.5,196.0" fill="#18202A"/><rect x="200" y="209" width="200" height="60" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">name == null?</text><path d="M200 239 H135 V313" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="135.0,313.0 130.5,303.0 139.5,303.0" fill="#18202A"/><path d="M400 239 H465 V313" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="465.0,313.0 460.5,303.0 469.5,303.0" fill="#18202A"/><text x="116" y="232" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">yes</text><text x="447" y="232" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">no</text><rect x="30" y="317" width="220" height="65" rx="15" fill=