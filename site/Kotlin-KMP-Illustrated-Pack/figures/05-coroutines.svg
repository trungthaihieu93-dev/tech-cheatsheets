<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img"><title>05 / TASKS HAVE OWNERS</title><desc>Cancellation follows the parent–child task tree.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#18202A"/></marker></defs><rect width="600" height="500" fill="#FFFEF7"/><path d="M28 28 H560" stroke="#FEF08A" stroke-width="26"/><text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">05 / TASKS HAVE OWNERS</text><text x="30" y="70" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">Cancellation follows the parent–child task tree.</text><rect x="165" y="100" width="270" height="72" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Caller job</text><path d="M300 172 L300 222" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="300.0,222.0 295.5,212.0 304.5,212.0" fill="#18202A"/><rect x="165" y="230" width="270" height="72" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">coroutineScope</text><path d="M300 302 V330 H155 V356" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="155.0,356.0 150.5,346.0 159.5,346.0" fill="#18202A"/><path d="M300 302 V330 H445 V356" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="445.0,356.0 440.5,346.0 449.5,346.0" fill="#18202A"/><rect x="35" y="360" width="240" height="70" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="155.0" y="402.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">async: profile</text><rect x="325" y="360" width="240" height="70" rx="15" fill="#F