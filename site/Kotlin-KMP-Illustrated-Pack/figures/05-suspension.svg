<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 475" role="img"><title>SUSPEND IS NOT A THREAD SWITCH</title><desc>A conceptual timeline, not a scheduler guarantee.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#18202A"/></marker></defs><rect width="600" height="475" fill="#FFFEF7"/><path d="M28 28 H560" stroke="#FEF08A" stroke-width="26"/><text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">SUSPEND IS NOT A THREAD SWITCH</text><text x="30" y="70" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">A conceptual timeline, not a scheduler guarantee.</text><text x="30" y="125" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="700" fill="#18202A">Thread A</text><rect x="30" y="155" width="155" height="80" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="107.5" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Task 1</text><text x="107.5" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">runs</text><rect x="220" y="155" width="155" height="80" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="297.5" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Task 2</text><text x="297.5" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">runs</text><rect x="410" y="155" width="155" height="80" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="487.5" y="188.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Task 1</text><text x="487.5" y="216.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">resumes</text><path d="M185 195 L220 195" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="220.0,195.0 210.0,199.5 210.0,190.5" fill="#18202A"/><path d="M375 195 L410 195" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="410.0,195.0 400.0,199.5 400.0,190.5" fill="#18202A"/><text x="32" y="280" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="400" fill="#18202A">Task 1 suspends while waiting; the thread can do other work.</text><rect x="85" y="310" width="430" height="65" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="349.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Blocking work blocks its thread.</text><text x="30" y="427" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="400" fill="#1E3A8A">Dispatcher controls execution; suspend allows suspension.</text></svg>