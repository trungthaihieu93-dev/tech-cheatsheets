<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img"><title>11 / TWO LIFETIME MECHANISMS</title><desc>A mixed strong-reference cycle can retain the whole graph.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#18202A"/></marker></defs><rect width="600" height="500" fill="#FFFEF7"/><path d="M28 28 H560" stroke="#FEF08A" stroke-width="26"/><text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">11 / TWO LIFETIME MECHANISMS</text><text x="30" y="70" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">A mixed strong-reference cycle can retain the whole graph.</text><rect x="45" y="120" width="230" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="160.0" y="158.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Kotlin holder</text><text x="160.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">tracing GC</text><rect x="325" y="120" width="230" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="440.0" y="158.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Swift callback</text><text x="440.0" y="186.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">ARC</text><path d="M275 142 L325 142" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="325.0,142.0 315.0,146.5 315.0,137.5" fill="#18202A"/><path d="M325 190 L275 190" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="275.0,190.0 285.0,185.5 285.0,194.5" fill="#18202A"/><text x="225" y="253" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">strong references in both directions</text><rect x="100" y="292" width="400" height="80" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="300.0" y="325.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Break ownership explicitly</text><text x="300.0" y="353.0" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">weak capture / detach callback</text><text x="30" y="452" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="400" fill="#1E3A8A">Cancel subscriptions; do not rely on deinit timing for cleanup.</text></svg>