<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img"><title>06 / STREAM WORK VS CURRENT STATE</title><desc>Cold flow and hot state answer different questions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#18202A"/></marker></defs><rect width="600" height="480" fill="#FFFEF7"/><path d="M28 28 H560" stroke="#FEF08A" stroke-width="26"/><text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">06 / STREAM WORK VS CURRENT STATE</text><text x="30" y="70" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="400" fill="#18202A">Cold flow and hot state answer different questions.</text><rect x="30" y="115" width="245" height="85" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="152.5" y="150.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">flow { emit(...) }</text><text x="152.5" y="178.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">work starts on collect</text><rect x="325" y="115" width="245" height="85" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="447.5" y="150.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">StateFlow</text><text x="447.5" y="178.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">current value exists</text><path d="M150 200 L150 273" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="150.0,273.0 145.5,263.0 154.5,263.0" fill="#18202A"/><path d="M448 200 L448 273" stroke="#18202A" stroke-width="2.3" fill="none"/><polygon points="448.0,273.0 443.5,263.0 452.5,263.0" fill="#18202A"/><rect x="30" y="278" width="245" height="85" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="152.5" y="313.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">Collector A starts</text><text x="152.5" y="341.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">its own execution</text><rect x="325" y="278" width="245" height="85" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="447.5" y="313.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">New collector sees</text><text x="447.5" y="341.5" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#18202A">the latest state</text><text x="30" y="432" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="400" fill="#1E3A8A">StateFlow conflates equal values; it is not an event log.</text></svg>