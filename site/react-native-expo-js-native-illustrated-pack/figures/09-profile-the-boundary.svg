<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Measure before moving work native</title><desc id="desc">A measurement loop, not a claim that native code is inherently faster for a particular workload.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,129 L305,129" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="277.5" y="80" text-anchor="middle" class="edge">observe</text><path d="M485,129 L540,129" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="512.5" y="80" text-anchor="middle" class="edge">localize</text><path d="M720,129 L775,129" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="747.5" y="80" text-anchor="middle" class="edge">experiment</text><path d="M775,129 L720,274" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="747.5" y="193.5" text-anchor="middle" class="edge">compare</text><rect x="70" y="90" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="160" y="123" text-anchor="middle" class="big">Symptom</text><text x="160" y="147" text-anchor="middle" class="small">jank / slow action</text><rect x="305" y="90" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="395" y="123" text-anchor="middle" class="big">Trace</text><text x="395" y="147" text-anchor="middle" class="small">JS + UI frames</text><rect x="540" y="90" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="630" y="123" text-anchor="middle" class="big">Hypothesis</text><text x="630" y="147" text-anchor="middle" class="small">specific boundary</text><rect x="775" y="90" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="865" y="123" text-anchor="middle" class="big">Change</text><text x="865" y="147" text-anchor="middle" class="small">batch / async / native</text><rect x="540" y="235" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="630" y="268" text-anchor="middle" class="big">Re-measure</text><text x="630" y="292" text-anchor="middle" class="small">same device + flow</text></svg>