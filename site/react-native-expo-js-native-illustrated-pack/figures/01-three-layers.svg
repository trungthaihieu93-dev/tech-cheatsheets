<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">One app, three layers</title><desc id="desc">Conceptual layers. The module path is distinct from rendering; all arrows are interface relationships, not guaranteed threads.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M270,119 L335,119" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="302.5" y="70" text-anchor="middle" class="edge">executes in</text><path d="M515,119 L580,119" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="547.5" y="70" text-anchor="middle" class="edge">calls into</text><path d="M760,119 L790,119" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="775.0" y="70" text-anchor="middle" class="edge">mounts / invokes</text><path d="M545,235 L670,158" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="607.5" y="188.5" text-anchor="middle" class="edge">uses</text><rect x="90" y="80" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="180" y="113" text-anchor="middle" class="big">React + TS</text><text x="180" y="137" text-anchor="middle" class="small">JS application</text><rect x="335" y="80" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="425" y="113" text-anchor="middle" class="big">Hermes</text><text x="425" y="137" text-anchor="middle" class="small">JS runtime</text><rect x="580" y="80" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="670" y="113" text-anchor="middle" class="big">JSI / RN C++</text><text x="670" y="137" text-anchor="middle" class="small">interop + renderer</text><rect x="790" y="80" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="880" y="113" text-anchor="middle" class="big">Android / iOS</text><text x="880" y="137" text-anchor="middle" class="small">platform APIs + views</text><rect x="455" y="235" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="545" y="268" text-anchor="middle" class="big">Expo Modules</text><text x="545" y="292" text-anchor="middle" class="small">module layer over JSI</text></svg>