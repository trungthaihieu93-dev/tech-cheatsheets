<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">The native binary is an API contract</title><desc id="desc">Build-time native surface and update-time JS surface. An OTA update cannot add a new compiled native module.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,124 L350,124" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="300.0" y="75" text-anchor="middle" class="edge">generate</text><path d="M530,124 L690,124" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="610.0" y="75" text-anchor="middle" class="edge">ship</text><path d="M530,274 L690,274" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="610.0" y="225" text-anchor="middle" class="edge">checks</text><path d="M780,235 L780,163" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="780.0" y="191.0" text-anchor="middle" class="edge">targets</text><rect x="70" y="85" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="160" y="118" text-anchor="middle" class="big">App config</text><text x="160" y="142" text-anchor="middle" class="small">plugins + dependencies</text><rect x="350" y="85" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="440" y="118" text-anchor="middle" class="big">Prebuild / compile</text><text x="440" y="142" text-anchor="middle" class="small">native projects</text><rect x="690" y="85" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="780" y="118" text-anchor="middle" class="big">Installed binary</text><text x="780" y="142" text-anchor="middle" class="small">native APIs</text><rect x="350" y="235" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="440" y="268" text-anchor="middle" class="big">OTA update</text><text x="440" y="292" text-anchor="middle" class="small">JS bundle</text><rect x="690" y="235" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="780" y="268" text-anchor="middle" class="big">runtimeVersion</text><text x="780" y="292" text-anchor="middle" class="small">compatibility gate</text></svg>