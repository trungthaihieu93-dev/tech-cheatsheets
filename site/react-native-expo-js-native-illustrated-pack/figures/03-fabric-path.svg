<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Fabric: from JSX to pixels</title><desc id="desc">The common rendering path. Scheduling can differ; the final host-view mutation belongs on the UI thread.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M260,134 L315,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="287.5" y="85" text-anchor="middle" class="edge">render</text><path d="M495,134 L550,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="522.5" y="85" text-anchor="middle" class="edge">commit</text><path d="M730,134 L780,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="755.0" y="85" text-anchor="middle" class="edge">diff</text><path d="M870,173 L870,245" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="870.0" y="201.0" text-anchor="middle" class="edge">apply</text><rect x="80" y="95" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="170" y="128" text-anchor="middle" class="big">JSX + state</text><text x="170" y="152" text-anchor="middle" class="small">React render</text><rect x="315" y="95" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="405" y="128" text-anchor="middle" class="big">Shadow tree</text><text x="405" y="152" text-anchor="middle" class="small">C++ nodes</text><rect x="550" y="95" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="640" y="128" text-anchor="middle" class="big">Commit + Yoga</text><text x="640" y="152" text-anchor="middle" class="small">layout</text><rect x="780" y="95" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="870" y="128" text-anchor="middle" class="big">Mount</text><text x="870" y="152" text-anchor="middle" class="small">UI thread</text><rect x="780" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="870" y="278" text-anchor="middle" class="big">Host views</text><text x="870" y="302" text-anchor="middle" class="small">Android View / UIView</text></svg>