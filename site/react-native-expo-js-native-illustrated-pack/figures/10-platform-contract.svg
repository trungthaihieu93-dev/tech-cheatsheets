<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">One JS API, honest platform behavior</title><desc id="desc">The public API can be shared; platform lifecycle and capability checks remain separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,124 L375,94" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="312.5" y="101.0" text-anchor="middle" class="edge">implement</text><path d="M250,124 L375,244" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="312.5" y="176.0" text-anchor="middle" class="edge">implement</text><path d="M555,94 L760,124" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="657.5" y="101.0" text-anchor="middle" class="edge">verify</text><path d="M555,244 L760,274" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="657.5" y="251.0" text-anchor="middle" class="edge">verify</text><rect x="70" y="85" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="160" y="118" text-anchor="middle" class="big">JS contract</text><text x="160" y="142" text-anchor="middle" class="small">typed result</text><rect x="375" y="55" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="465" y="88" text-anchor="middle" class="big">Android path</text><text x="465" y="112" text-anchor="middle" class="small">Activity + Kotlin</text><rect x="375" y="205" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="465" y="238" text-anchor="middle" class="big">iOS path</text><text x="465" y="262" text-anchor="middle" class="small">App + Swift</text><rect x="760" y="85" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="850" y="118" text-anchor="middle" class="big">Shared tests</text><text x="850" y="142" text-anchor="middle" class="small">shape + errors</text><rect x="760" y="235" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="850" y="268" text-anchor="middle" class="big">Device checks</text><text x="850" y="292" text-anchor="middle" class="small">lifecycle / permission</text></svg>