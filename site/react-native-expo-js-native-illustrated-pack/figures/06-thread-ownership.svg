<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Threads: keep the caller responsive</title><desc id="desc">Queue ownership for an illustrative operation; the exact dispatch path depends on the module API and implementation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,114 L370,114" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="310.0" y="65" text-anchor="middle" class="edge">dispatch</text><path d="M460,153 L460,235" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="460.0" y="186.0" text-anchor="middle" class="edge">resolve</text><path d="M370,274 L250,114" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="310.0" y="186.0" text-anchor="middle" class="edge">callback</text><path d="M550,114 L700,114" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="625.0" y="65" text-anchor="middle" class="edge">brief UI hop</text><rect x="70" y="75" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="160" y="108" text-anchor="middle" class="big">JS thread</text><text x="160" y="132" text-anchor="middle" class="small">React + sync call</text><rect x="370" y="75" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="460" y="108" text-anchor="middle" class="big">Worker / native queue</text><text x="460" y="132" text-anchor="middle" class="small">I/O + CPU task</text><rect x="700" y="75" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="790" y="108" text-anchor="middle" class="big">UI/main thread</text><text x="790" y="132" text-anchor="middle" class="small">platform view change</text><rect x="370" y="235" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="460" y="268" text-anchor="middle" class="big">Promise / event</text><text x="460" y="292" text-anchor="middle" class="small">result to JS</text></svg>