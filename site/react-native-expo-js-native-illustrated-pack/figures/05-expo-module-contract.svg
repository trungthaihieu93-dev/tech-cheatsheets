<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Expo Modules: one API, two platforms</title><desc id="desc">The same JS interface leads to separately implemented platform behavior; Expo is an abstraction over the RN boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M260,129 L335,129" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="297.5" y="80" text-anchor="middle" class="edge">API call</text><path d="M515,129 L700,89" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="607.5" y="101.0" text-anchor="middle" class="edge">platform path</text><path d="M515,129 L700,239" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="607.5" y="176.0" text-anchor="middle" class="edge">platform path</text><rect x="80" y="90" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="170" y="123" text-anchor="middle" class="big">JS/TS wrapper</text><text x="170" y="147" text-anchor="middle" class="small">requireNativeModule</text><rect x="335" y="90" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="425" y="123" text-anchor="middle" class="big">Expo Modules API</text><text x="425" y="147" text-anchor="middle" class="small">JSI-based layer</text><rect x="700" y="50" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="790" y="83" text-anchor="middle" class="