<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Native events need a lifecycle</title><desc id="desc">Event lifecycle and data flow. Aggregation and event ordering must be designed for the particular producer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,139 L310,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="280.0" y="90" text-anchor="middle" class="edge">observed by</text><path d="M490,139 L550,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="520.0" y="90" text-anchor="middle" class="edge">emit</text><path d="M730,139 L790,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="760.0" y="90" text-anchor="middle" class="edge">deliver</text><path d="M400,245 L400,178" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="400.0" y="203.5" text-anchor="middle" class="edge">unsubscribe</text><rect x="70" y="100" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="160" y="133" text-anchor="middle" class="big">Native producer</text><text x="160" y="157" text-anchor="middle" class="small">sensor / SDK</text><rect x="310" y="100" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="400" y="133" text-anchor="middle" class="big">Subscription</text><text x="400" y="157" text-anchor="middle" class="small">start / stop</text><rect x="550" y="100" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="640" y="133" text-anchor="middle" class="big">Event payload</text><text x="640" y="157" text-anchor="middle" class="small">sample / aggregate</text><rect x="790" y="100" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="880" y="133" text-anchor="middle" class="big">JS listener</text><text x="880" y="157" text-anchor="middle" class="small">update state</text><rect x="310" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="400" y="278" text-anchor="middle" class="big">Cleanup</text><text x="400" y="302" text-anchor="middle" class="small">screen / app lifecycle</text></svg>