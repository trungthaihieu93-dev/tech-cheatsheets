<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">What JSI changed</title><desc id="desc">Two conceptual interop paths; the lower path removes mandatory bridge serialization, not every copy or scheduling cost.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.big{font:700 19px system-ui,sans-serif;fill:#18202A}.small{font:15px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="22" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M255,119 L325,119" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="290.0" y="70" text-anchor="middle" class="edge">legacy</text><path d="M505,119 L650,119" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="577.5" y="70" text-anchor="middle" class="edge">dispatch</text><path d="M255,269 L325,269" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="290.0" y="220" text-anchor="middle" class="edge">new</text><path d="M505,269 L650,269" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrow)"/><text x="577.5" y="220" text-anchor="middle" class="edge">invoke</text><rect x="75" y="80" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="165" y="113" text-anchor="middle" class="big">Legacy JS</text><text x="165" y="137" text-anchor="middle" class="small">request</text><rect x="325" y="80" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="415" y="113" text-anchor="middle" class="big">Serialized queue</text><text x="415" y="137" text-anchor="middle" class="small">copy / parse</text><rect x="650" y="80" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="740" y="113" text-anchor="middle" class="big">Native</text><text x="740" y="137" text-anchor="middle" class="small">method</text><rect x="75" y="230" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="165" y="263" text-anchor="middle" class="big">New JS</text><text x="165" y="287" text-anchor="middle" class="small">JSI call</text><rect x="325" y="230" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="415" y="263" text-anchor="middle" class="big">C++ host object</text><text x="415" y="287" text-anchor="middle" class="small">reference + binding</text><rect x="650" y="230" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="740" y="263" text-anchor="middle" class="big">Native</text><text x="740" y="287" text-anchor="middle" class="small">method</text></svg>