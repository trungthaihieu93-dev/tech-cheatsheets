<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Performance hypothesis loop</title><desc id="desc">An experimental plan; it asserts no universal Hermes performance gain.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M240,139 L315,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="277.5" y="87" text-anchor="middle" class="edge">record</text><path d="M495,139 L565,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="530.0" y="87" text-anchor="middle" class="edge">localize</text><path d="M745,139 L800,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="772.5" y="87" text-anchor="middle" class="edge">change</text><path d="M800,139 L745,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="772.5" y="203.5" text-anchor="middle" class="edge">compare</text><rect x="60" y="100" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="150" y="132" text-anchor="middle" class="name">Release baseline</text><text x="150" y="157" text-anchor="middle" class="detail">cold start + heap</text><rect x="315" y="100" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="405" y="132" text-anchor="middle" class="name">Trace JS</text><text x="405" y="157" text-anchor="middle" class="detail">execution / allocs</text><rect x="565" y="100" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="655" y="132" text-anchor="middle" class="name">Find root cause</text><text x="655" y="157" text-anchor="middle" class="detail">not just GC</text><rect x="800" y="100" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="890" y="132" text-anchor="middle" class="name">Targeted change</text><text x="890" y="157" text-anchor="middle" class="detail">defer / release</text><rect x="565" y="245" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="655" y="277" text-anchor="middle" class="name">Repeat journey</text><text x="655" y="302" text-anchor="middle" class="detail">same device</text></svg>