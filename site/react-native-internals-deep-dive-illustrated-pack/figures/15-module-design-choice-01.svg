<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Decision map</title><desc id="desc">A practical decision aid, not an exclusive taxonomy; mixed designs are common.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M240,144 L330,89" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="285.0" y="108.5" text-anchor="middle" class="edge">yes</text><path d="M240,144 L330,264" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="285.0" y="196.0" text-anchor="middle" class="edge">service</text><path d="M510,264 L690,264" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="600.0" y="212" text-anchor="middle" class="edge">if required</text><rect x="60" y="105" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="150" y="137" text-anchor="middle" class="name">Need native API</text><text x="150" y="162" text-anchor="middle" class="detail">define contract</text><rect x="330" y="50" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="420" y="82" text-anchor="middle" class="name">Visual surface?</text><text x="420" y="107" text-anchor="middle" class="detail">component / View</text><rect x="330" y="225" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="420" y="257" text-anchor="middle" class="name">Swift / Kotlin?</text><text x="420" y="282" text-anchor="middle" class="detail">Expo Module</text><rect x="690" y="225" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="780" y="257" text-anchor="middle" class="name">C++ or Codegen?</text><text x="780" y="282" text-anchor="middle" class="detail">TurboModule</text></svg>