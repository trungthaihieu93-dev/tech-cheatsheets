<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Thread hops for an async task</title><desc id="desc">Illustrative queue plan. Actual Expo and TurboModule implementations control their own dispatch.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,139 L320,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="285.0" y="87" text-anchor="middle" class="edge">invoke</text><path d="M500,139 L570,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="535.0" y="87" text-anchor="middle" class="edge">dispatch</text><path d="M750,139 L800,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="775.0" y="87" text-anchor="middle" class="edge">if UI needed</text><path d="M660,178 L660,245" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="660.0" y="203.5" text-anchor="middle" class="edge">resolve</text><path d="M570,284 L250,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="410.0" y="203.5" text-anchor="middle" class="edge">callback</text><rect x="70" y="100" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="160" y="132" text-anchor="middle" class="name">JS caller</text><text x="160" y="157" text-anchor="middle" class="detail">Promise request</text><rect x="320" y="100" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="410" y="132" text-anchor="middle" class="name">Module adapter</text><text x="410" y="157" text-anchor="middle" class="detail">convert arguments</text><rect x="570" y="100" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="660" y="132" text-anchor="middle" class="name">Worker</text><text x="660" y="157" text-anchor="middle" class="detail">OCR / file I-O</text><rect x="800" y="100" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="890" y="132" text-anchor="middle" class="name">Main UI</text><text x="890" y="157" text-anchor="middle" class="detail">short view action</text><rect x="570" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="660" y="277" text-anchor="middle" class="name">JS result</text><text x="660" y="302" text-anchor="middle" class="detail">small payload</text></svg>