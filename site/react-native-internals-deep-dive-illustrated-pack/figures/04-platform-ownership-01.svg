<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Platform resource ownership</title><desc id="desc">The Promise is a JS interface; native lifecycle and OS callbacks decide when it settles.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M235,139 L305,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="270.0" y="87" text-anchor="middle" class="edge">invoke</text><path d="M485,139 L625,94" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="555.0" y="108.5" text-anchor="middle" class="edge">Android</text><path d="M485,139 L625,264" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="555.0" y="193.5" text-anchor="middle" class="edge">iOS</text><path d="M625,94 L485,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="555.0" y="181.0" text-anchor="middle" class="edge">result</text><path d="M625,264 L485,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="555.0" y="266.0" text-anchor="middle" class="edge">result</text><path d="M305,284 L235,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="270.0" y="203.5" text-anchor="middle" class="edge">settle</text><rect x="55" y="100" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="145" y="132" text-anchor="middle" class="name">JS Promise</text><text x="145" y="157" text-anchor="middle" class="detail">request + result</text><rect x="305" y="100" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="395" y="132" text-anchor="middle" class="name">Native module</text><text x="395" y="157" text-anchor="middle" class="detail">owns request state</text><rect x="625" y="55" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="715" y="87" text-anchor="middle" class="name">Android</text><text x="715" y="112" text-anchor="middle" class="detail">Activity + View</text><rect x="625" y="225" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="715" y="257" text-anchor="middle" class="name">iOS</text><text x="715" y="282" text-anchor="middle" class="detail">UIKit + app state</text><rect x="305" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="395" y="277" text-anchor="middle" class="name">OS callback</text><text x="395" y="302" text-anchor="middle" class="detail">complete / cancel</text></svg>