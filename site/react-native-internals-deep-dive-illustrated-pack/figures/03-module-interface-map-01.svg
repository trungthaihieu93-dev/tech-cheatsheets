<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Two authoring paths</title><desc id="desc">The two paths share the app runtime; the drawing emphasizes authoring contracts, not a claim of identical generated glue.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,139 L360,89" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="305.0" y="106.0" text-anchor="middle" class="edge">RN path</text><path d="M250,139 L360,254" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="305.0" y="188.5" text-anchor="middle" class="edge">Expo path</text><path d="M540,89 L700,89" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="620.0" y="37" text-anchor="middle" class="edge">generated glue</text><path d="M540,254 L700,254" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="620.0" y="202" text-anchor="middle" class="edge">module binding</text><rect x="70" y="100" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="160" y="132" text-anchor="middle" class="name">JS facade</text><text x="160" y="157" text-anchor="middle" class="detail">one public API</text><rect x="360" y="50" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="450" y="82" text-anchor="middle" class="name">Turbo spec</text><text x="450" y="107" text-anchor="middle" class="detail">TS / Flow</text><rect x="360" y="215" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="450" y="247" text-anchor="middle" class="name">Expo DSL</text><text x="450" y="272" text-anchor="middle" class="detail">Swift / Kotlin</text><rect x="700" y="50" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="790" y="82" text-anchor="middle" class="name">Android code</text><text x="790" y="107" text-anchor="middle" class="detail">SDK + OS APIs</text><rect x="700" y="215" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="790" y="247" text-anchor="middle" class="name">iOS code</text><text x="790" y="272" text-anchor="middle" class="detail">SDK + OS APIs</text></svg>