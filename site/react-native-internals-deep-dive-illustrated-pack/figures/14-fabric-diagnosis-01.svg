<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Find the costly phase</title><desc id="desc">The path localizes phases; scheduling and overlap vary by scenario.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M235,139 L300,94" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="267.5" y="108.5" text-anchor="middle" class="edge">trace</text><path d="M480,94 L540,94" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="510.0" y="42" text-anchor="middle" class="edge">phase</text><path d="M720,94 L780,94" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="750.0" y="42" text-anchor="middle" class="edge">phase</text><path d="M780,94 L720,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="750.0" y="181.0" text-anchor="middle" class="edge">validate</text><rect x="55" y="100" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="145" y="132" text-anchor="middle" class="name">Interaction</text><text x="145" y="157" text-anchor="middle" class="detail">slow frame</text><rect x="300" y="55" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="390" y="87" text-anchor="middle" class="name">Render</text><text x="390" y="112" text-anchor="middle" class="detail">JS + shadow nodes</text><rect x="540" y="55" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="630" y="87" text-anchor="middle" class="name">Commit</text><text x="630" y="112" text-anchor="middle" class="detail">layout + promotion</text><rect x="780" y="55" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="870" y="87" text-anchor="middle" class="name">Mount</text><text x="870" y="112" text-anchor="middle" class="detail">UI mutations</text><rect x="540" y="245" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="630" y="277" text-anchor="middle" class="name">Measure again</text><text x="630" y="302" text-anchor="middle" class="detail">same scenario</text></svg>