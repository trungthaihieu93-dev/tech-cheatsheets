<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Common scheduling path</title><desc id="desc">A common path, not the only scheduling path. High-priority work can render on UI.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M245,144 L340,144" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="292.5" y="92" text-anchor="middle" class="edge">create</text><path d="M520,144 L615,144" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="567.5" y="92" text-anchor="middle" class="edge">promote</text><path d="M705,183 L705,245" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="705.0" y="206.0" text-anchor="middle" class="edge">apply</text><rect x="65" y="105" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="155" y="137" text-anchor="middle" class="name">JS thread</text><text x="155" y="162" text-anchor="middle" class="detail">React render</text><rect x="340" y="105" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="430" y="137" text-anchor="middle" class="name">C++ shadow tree</text><text x="430" y="162" text-anchor="middle" class="detail">immutable updates</text><rect x="615" y="105" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="705" y="137" text-anchor="middle" class="name">Commit / layout</text><text x="705" y="162" text-anchor="middle" class="detail">may be background</text><rect x="615" y="245" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="705" y="277" text-anchor="middle" class="name">UI thread</text><text x="705" y="302" text-anchor="middle" class="detail">mount host views</text></svg>