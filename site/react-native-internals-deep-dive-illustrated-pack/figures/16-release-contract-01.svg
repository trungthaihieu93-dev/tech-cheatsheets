<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Build versus update surface</title><desc id="desc">Native API changes require a new binary; the update must match its compatible runtime.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M235,134 L325,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="280.0" y="82" text-anchor="middle" class="edge">compile</text><path d="M505,134 L670,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="587.5" y="82" text-anchor="middle" class="edge">install</text><path d="M505,284 L670,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="587.5" y="232" text-anchor="middle" class="edge">check</text><path d="M760,245 L760,173" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="760.0" y="201.0" text-anchor="middle" class="edge">target</text><rect x="55" y="95" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="145" y="127" text-anchor="middle" class="name">Native sources</text><text x="145" y="152" text-anchor="middle" class="detail">Kotlin + Swift</text><rect x="325" y="95" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="415" y="127" text-anchor="middle" class="name">Build binary</text><text x="415" y="152" text-anchor="middle" class="detail">compiled modules</text><rect x="670" y="95" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="760" y="127" text-anchor="middle" class="name">Installed app</text><text x="760" y="152" text-anchor="middle" class="detail">native surface</text><rect x="325" y="245" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="415" y="277" text-anchor="middle" class="name">JS update</text><text x="415" y="302" text-anchor="middle" class="detail">new JS bundle</text><rect x="670" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="760" y="277" text-anchor="middle" class="name">Runtime version</text><text x="760" y="302" text-anchor="middle" class="detail">compatibility gate</text></svg>