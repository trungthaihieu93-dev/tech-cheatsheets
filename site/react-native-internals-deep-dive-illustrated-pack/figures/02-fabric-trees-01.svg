<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Representations and phases</title><desc id="desc">Conceptual render path. Some render or commit work may use other scheduling scenarios.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M235,134 L295,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="265.0" y="82" text-anchor="middle" class="edge">render</text><path d="M475,134 L535,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="505.0" y="82" text-anchor="middle" class="edge">commit</text><path d="M715,134 L775,134" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="745.0" y="82" text-anchor="middle" class="edge">diff</text><path d="M865,173 L865,245" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="865.0" y="201.0" text-anchor="middle" class="edge">mutate</text><rect x="55" y="95" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="145" y="127" text-anchor="middle" class="name">React elements</text><text x="145" y="152" text-anchor="middle" class="detail">JS / React tree</text><rect x="295" y="95" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="385" y="127" text-anchor="middle" class="name">Shadow nodes</text><text x="385" y="152" text-anchor="middle" class="detail">C++ immutable tree</text><rect x="535" y="95" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="625" y="127" text-anchor="middle" class="name">Layout + commit</text><text x="625" y="152" text-anchor="middle" class="detail">next tree</text><rect x="775" y="95" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="865" y="127" text-anchor="middle" class="name">Mount diff</text><text x="865" y="152" text-anchor="middle" class="detail">UI thread</text><rect x="775" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="865" y="277" text-anchor="middle" class="name">Host views</text><text x="865" y="302" text-anchor="middle" class="detail">Android / iOS</text></svg>