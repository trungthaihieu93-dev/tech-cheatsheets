<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Two memory domains</title><desc id="desc">Separate observations. The diagram does not imply a one-to-one allocation mapping.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M255,129 L340,129" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="297.5" y="77" text-anchor="middle" class="edge">holds</text><path d="M520,129 L650,129" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="585.0" y="77" text-anchor="middle" class="edge">refers</text><path d="M165,168 L165,245" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="165.0" y="198.5" text-anchor="middle" class="edge">inspect</text><path d="M740,168 L740,245" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="740.0" y="198.5" text-anchor="middle" class="edge">inspect</text><rect x="75" y="90" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="165" y="122" text-anchor="middle" class="name">Hermes heap</text><text x="165" y="147" text-anchor="middle" class="detail">JS objects</text><rect x="340" y="90" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="430" y="122" text-anchor="middle" class="name">Host object</text><text x="430" y="147" text-anchor="middle" class="detail">JS-visible handle</text><rect x="650" y="90" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="740" y="122" text-anchor="middle" class="name">Native heap</text><text x="740" y="147" text-anchor="middle" class="detail">bitmap / SDK</text><rect x="75" y="245" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="165" y="277" text-anchor="middle" class="name">JS snapshot</text><text x="165" y="302" text-anchor="middle" class="detail">only JS reachability</text><rect x="650" y="245" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="740" y="277" text-anchor="middle" class="name">Platform profiler</text><text x="740" y="302" text-anchor="middle" class="detail">native allocation</text></svg>