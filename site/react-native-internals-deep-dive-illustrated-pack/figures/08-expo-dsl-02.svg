<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Sync versus async</title><desc id="desc">AsyncFunction dispatches by default; UI work requires an explicit main-queue decision.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,144 L330,144" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="290.0" y="92" text-anchor="middle" class="edge">sync</text><path d="M250,284 L330,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="290.0" y="232" text-anchor="middle" class="edge">dispatch</text><path d="M510,284 L690,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="600.0" y="232" text-anchor="middle" class="edge">when needed</text><rect x="70" y="105" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="160" y="137" text-anchor="middle" class="name">Function</text><text x="160" y="162" text-anchor="middle" class="detail">JS caller thread</text><rect x="330" y="105" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="420" y="137" text-anchor="middle" class="name">Quick native work</text><text x="420" y="162" text-anchor="middle" class="detail">blocks caller</text><rect x="70" y="245" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="160" y="277" text-anchor="middle" class="name">AsyncFunction</text><text x="160" y="302" text-anchor="middle" class="detail">Promise to JS</text><rect x="330" y="245" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="420" y="277" text-anchor="middle" class="name">Native queue</text><text x="420" y="302" text-anchor="middle" class="detail">work / I-O</text><rect x="690" y="245" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="780" y="277" text-anchor="middle" class="name">Main queue</text><text x="780" y="302" text-anchor="middle" class="detail">UI operations only</text></svg>