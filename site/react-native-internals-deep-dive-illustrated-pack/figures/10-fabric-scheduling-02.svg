<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Frame diagnosis</title><desc id="desc">Use both JS and platform traces to localize a frame problem.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M250,139 L355,94" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="302.5" y="108.5" text-anchor="middle" class="edge">inspect</text><path d="M250,139 L355,264" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="302.5" y="193.5" text-anchor="middle" class="edge">inspect</text><path d="M535,94 L720,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="627.5" y="108.5" text-anchor="middle" class="edge">hypothesis</text><path d="M535,264 L720,139" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="627.5" y="193.5" text-anchor="middle" class="edge">hypothesis</text><rect x="70" y="100" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="160" y="132" text-anchor="middle" class="name">Slow frame</text><text x="160" y="157" text-anchor="middle" class="detail">observed jank</text><rect x="355" y="55" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="445" y="87" text-anchor="middle" class="name">JS trace</text><text x="445" y="112" text-anchor="middle" class="detail">logic / render</text><rect x="355" y="225" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="445" y="257" text-anchor="middle" class="name">UI trace</text><text x="445" y="282" text-anchor="middle" class="detail">mount / SDK</text><rect x="720" y="100" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="810" y="132" text-anchor="middle" class="name">Change one cause</text><text x="810" y="157" text-anchor="middle" class="detail">repeat measurement</text></svg>