<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">State update and sharing</title><desc id="desc">Structural sharing is conceptual; the exact clone set depends on props and layout changes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1E3A8A"/></marker></defs><style>.name{font:700 18px system-ui,sans-serif;fill:#18202A}.detail{font:14px system-ui,sans-serif;fill:#334155}.edge{font:14px system-ui,sans-serif;fill:#1E3A8A;paint-order:stroke;stroke:#FFFEF7;stroke-width:5px}</style><rect width="1000" height="360" rx="20" fill="#FFFEF7" stroke="#CBD5E1" stroke-width="2"/><path d="M265,144 L340,144" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="302.5" y="92" text-anchor="middle" class="edge">update</text><path d="M520,144 L600,144" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="560.0" y="92" text-anchor="middle" class="edge">clone</text><path d="M265,144 L600,284" fill="none" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arr)"/><text x="432.5" y="206.0" text-anchor="middle" class="edge">reuse</text><rect x="85" y="105" width="180" height="78" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/><text x="175" y="137" text-anchor="middle" class="name">Old tree</text><text x="175" y="162" text-anchor="middle" class="detail">A — B — C</text><rect x="340" y="105" width="180" height="78" rx="17" fill="#FFE4E6" stroke="#EC4899" stroke-width="3"/><text x="430" y="137" text-anchor="middle" class="name">Changed leaf</text><text x="430" y="162" text-anchor="middle" class="detail">B becomes B′</text><rect x="600" y="105" width="180" height="78" rx="17" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/><text x="690" y="137" text-anchor="middle" class="name">New tree</text><text x="690" y="162" text-anchor="middle" class="detail">clone path to root</text><rect x="600" y="245" width="180" height="78" rx="17" fill="#FEF9C3" stroke="#EAB308" stroke-width="3"/><text x="690" y="277" text-anchor="middle" class="name">Unchanged C</text><text x="690" y="302" text-anchor="middle" class="detail">shared node</text></svg>