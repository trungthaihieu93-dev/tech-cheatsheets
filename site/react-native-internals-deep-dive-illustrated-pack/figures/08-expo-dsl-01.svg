ue + SDK</text><rect x="670" y="220" width="180" height="78" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/><text x="760" y="252" text-anchor="middle" class="name">Kotlin / Android</text><text x="760" y="277" text-anchor="middle" class="detail">queue + SDK</text></svg>