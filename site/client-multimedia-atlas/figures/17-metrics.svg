<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592" role="img"><title>Report the metric and its denominator</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="720" height="592" rx="18" fill="#FFFEF7"/><text x="26" y="37" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="start">Report the metric and its denominator</text><path d="M26 49 Q280 46 694 49" stroke="#7C3AED" stroke-width="3" fill="none"/><rect x="26" y="78" width="320" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="40" y="107" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Startup delay</text><text x="40" y="132" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Play intent → first rendered</text><text x="40" y="155" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">playback</text><rect x="26" y="228" width="320" height="112" rx="13" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="40" y="257" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Rebuffer ratio</text><text x="40" y="282" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Stalled time / chosen watch</text><text x="40" y="305" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">time</text><rect x="26" y="378" width="320" height="112" rx="13" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="40" y="407" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fil