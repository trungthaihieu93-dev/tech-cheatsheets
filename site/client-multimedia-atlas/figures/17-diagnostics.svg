<svg xmlns="http://www.w3.org/2000/svg" width="720" height="692" viewBox="0 0 720 692" role="img"><title>Debug from the symptom back to its owner</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="720" height="692" rx="18" fill="#FFFEF7"/><text x="26" y="37" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="start">Debug from the symptom back to its owner</text><path d="M26 49 Q280 46 694 49" stroke="#7C3AED" stroke-width="3" fill="none"/><rect x="28" y="75" width="385" height="112" rx="13" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="42" y="104" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">No first frame</text><text x="42" y="129" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Source? access? codec? blocked play?</text><text x="435" y="105" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">01</text><text x="478" y="103" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">200 OK is only one piece</text><text x="478" y="126" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">of evidence.</text><path d="M220 187 L220 221" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="28" y="225" width="385" height="112" rx="13" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="42" y="254" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Starts, then buffers</text><text x="42" y="279" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Segment timing? network? ABR?</text><text x="435" y="255" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">02</text><text x="478" y="253" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Look at buffer and</text><text x="478" y="276" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">request timing together.</text><path d="M220 337 L220 371" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="28" y="375" width="385" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="42" y="404" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Only one device fails</text><text x="42" y="429" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Native/MSE, codec, DRM matrix</text><text x="435" y="405" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">03</text><text x="478" y="403" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Reproduce on the actual</text><text x="478" y="426" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">OS/browser.</text><path d="M220 487 L220 521" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="28" y="525" width="385" height="112" rx="13" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="42" y="554" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">QoE events + request evidence</text><text x="42" y="579" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Correlate asset, device, stage</text><text x="435" y="555" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">04</text><text x="478" y="553" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Redact secrets before</text><text x="478" y="576" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">recording details.</text></svg>