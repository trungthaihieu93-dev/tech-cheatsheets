<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592" role="img"><title>Access control and browser access are distinct</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="720" height="592" rx="18" fill="#FFFEF7"/><text x="26" y="37" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="start">Access control and browser access are distinct</text><path d="M26 49 Q280 46 694 49" stroke="#7C3AED" stroke-width="3" fill="none"/><rect x="26" y="78" width="320" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="40" y="107" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Application authorization</text><text x="40" y="132" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Who may watch this asset?</text><rect x="26" y="228" width="320" height="112" rx="13" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="40" y="257" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Signed delivery</text><text x="40" y="281" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">capability</text><text x="40" y="306" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Validate on media requests</text><rect x="26" y="378" width="320" height="112" rx="13" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="40" y="407" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Optional DRM + CDM</text><text x="40" y="432" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Encrypted media + valid license</text><rect x="374" y="78" width="320" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="388" y="107" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">CORS response headers</text><text x="388" y="132" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">May this origin read responses?</text><rect x="374" y="228" width="320" height="112" rx="13" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="388" y="257" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Every resource in the</text><text x="388" y="281" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">graph</text><text x="388" y="306" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Manifest, segments, keys,</text><text x="388" y="329" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">tracks</text><rect x="374" y="378" width="320" height="112" rx="13" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="388" y="407" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Browser/codec/key-system</text><text x="388" y="431" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">test</text><text x="388" y="456" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Can this device play the asset?</text><text x="26" y="568" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">CORS is not entitlement. A signed URL is not DRM.</text></svg>