<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592" role="img"><title>A manifest describes choices; ABR selects one</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="720" height="592" rx="18" fill="#FFFEF7"/><text x="26" y="37" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="start">A manifest describes choices; ABR selects one</text><path d="M26 49 Q280 46 694 49" stroke="#7C3AED" stroke-width="3" fill="none"/><rect x="26" y="78" width="320" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="40" y="107" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">HLS: playlist .m3u8</text><text x="40" y="132" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Variants → media playlists</text><path d="M186 190 L186 224" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="26" y="228" width="320" height="112" rx="13" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="40" y="257" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Choose next segment</text><text x="40" y="282" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Bandwidth + buffer estimates</text><path d="M186 340 L186 374" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="26" y="378" width="320" height="112" rx="13" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="40" y="407" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Example: 2s at 1 Mbps</text><text x="40" y="432" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">About 2 Mbit encoded payload</text><rect x="374" y="78" width="320" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="388" y="107" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">DASH: manifest .mpd</text><text x="388" y="132" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Periods → sets →</text><text x="388" y="155" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">representations</text><path d="M534 190 L534 224" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="374" y="228" width="320" height="112" rx="13" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="388" y="257" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Choose next</text><text x="388" y="281" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">representation</text><text x="388" y="306" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">ABR + timeline + track logic</text><path d="M534 340 L534 374" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="374" y="378" width="320" height="112" rx="13" fill="#DCFCE7" stroke="#18202A" stroke-width="2.2"/><text x="388" y="407" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">At 2 Mbps throughput</text><text x="388" y="432" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">About 1s transfer, before</text><text x="388" y="455" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">overhead</text><text x="26" y="568" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Toy transfer estimate; not a prediction of real playback quality.</text></svg>