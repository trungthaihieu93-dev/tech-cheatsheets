<svg xmlns="http://www.w3.org/2000/svg" width="720" height="692" viewBox="0 0 720 692" role="img"><title>ReactPlayer routes; providers do the playback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="720" height="692" rx="18" fill="#FFFEF7"/><text x="26" y="37" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="start">ReactPlayer routes; providers do the playback</text><path d="M26 49 Q280 46 694 49" stroke="#7C3AED" stroke-width="3" fill="none"/><rect x="28" y="75" width="385" height="112" rx="13" fill="#DBEAFE" stroke="#18202A" stroke-width="2.2"/><text x="42" y="104" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">React props: src + controls</text><text x="42" y="129" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">App-level declarative interface</text><text x="435" y="105" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">01</text><text x="478" y="103" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">v3 uses src. Old v2</text><text x="478" y="126" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">examples often use url.</text><path d="M220 187 L220 221" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="28" y="225" width="385" height="112" rx="13" fill="#FEF9C3" stroke="#18202A" stroke-width="2.2"/><text x="42" y="254" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Source matching + lazy load</text><text x="42" y="279" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Select provider and its SDK</text><text x="435" y="255" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">02</text><text x="478" y="253" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">HLS, DASH and provider</text><text x="478" y="276" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">modules are separate</text><text x="478" y="299" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">paths.</text><path d="M220 337 L220 371" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="28" y="375" width="385" height="112" rx="13" fill="#FFE4E6" stroke="#18202A" stroke-width="2.2"/><text x="42" y="404" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">HTML media OR provider</text><text x="42" y="428" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">iframe</text><text x="42" y="453" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Capabilities differ by provider</text><text x="435" y="405" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">03</text><text x="478" y="403" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">One wrapper does not</text><text x="478" y="426" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">erase platform</text><text x="478" y="449" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">restrictions.</text><path d="M220 487 L220 521" stroke="#18202A" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="28" y="525" width="385" height="112" rx="13" fill="#F3E8FF" stroke="#18202A" stroke-width="2.2"/><text x="42" y="554" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Events back to the app</text><text x="42" y="579" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Normalize what the API supports</text><text x="435" y="555" font-family="Trebuchet MS,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">04</text><text x="478" y="553" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Can-play checks do not</text><text x="478" y="576" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">guarantee successful</text><text x="478" y="599" font-family="Trebuchet MS,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">delivery.</text></svg>