<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" role="img"><title>Booking.com: de-risk the migration</title><desc>Published phases, rendered as checkpoints rather than a complete topology.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="524" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">Booking.com: de-risk the migration</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Published phases, rendered as checkpoints rather than a complete topology.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="45" y="145" width="240" height="135" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="61" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">1 / Move</text><text x="61" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">inference</text><text x="61" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Validate separation</text><text x="61" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">from on-premises</text><text x="61" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">backend</text><rect x="330" y="145" width="240" height="135" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="346" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">2 / Move ranking</text><text x="346" y="200" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Ranking API + models</text><text x="346" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">on new architecture</text><rect x="615" y="145" width="240" height="135" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="631" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">3 / Hybrid</text><text x="631" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">serving</text><text x="631" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Balance public /</text><text x="631" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">private cloud use</text><path d="M285 215 L330 215" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 215 L615 215" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="170" y="350" width="560" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="186" y="376" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Dedicated EKS ranking environment</text><text x="186" y="405" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Benchmark instance types for the workload.</text><path d="M450 280 L450 350" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="451" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Reported: ~40 ms for 99.9% of requests. This is one workload’s published result.</text></svg>