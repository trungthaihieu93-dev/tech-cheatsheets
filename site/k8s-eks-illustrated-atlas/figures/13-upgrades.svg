<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" role="img"><title>13 / Upgrade with compatibility checkpoints</title><desc>The order is planned per component; avoid treating this as one magic command.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="645" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">13 / Upgrade with compatibility checkpoints</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">The order is planned per component; avoid treating this as one magic command.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="137" width="250" height="110" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="56" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Inventory +</text><text x="56" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">rehearsal</text><text x="56" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">APIs, webhooks, CRDs,</text><text x="56" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">add-ons, restore test</text><rect x="325" y="137" width="250" height="110" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="341" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Prepare</text><text x="341" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">prerequisites</text><text x="341" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Compatibility fixes +</text><text x="341" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">upgrade insights</text><rect x="610" y="137" width="250" height="110" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="626" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Control plane N →</text><text x="626" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">N+1</text><text x="626" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Follow the EKS upgrade</text><text x="626" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">procedure</text><path d="M290 190 L325 190" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 190 L610 190" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="365" width="250" height="115" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="626" y="391" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Nodes + add-ons</text><text x="626" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Roll compatible</text><text x="626" y="444" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">releases; preserve</text><text x="626" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor