<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" role="img"><title>14 / Improve a baseline with evidence</title><desc>Change one constraint, then measure user-visible behavior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="652" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">14 / Improve a baseline with evidence</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Change one constraint, then measure user-visible behavior.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="137" width="250" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="56" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Baseline</text><rect x="325" y="137" width="250" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="341" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">3 replicas,</text><text x="341" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">measured</text><text x="341" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">requests</text><rect x="610" y="137" width="250" height="90" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="626" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Record latency +</text><text x="626" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">error rate</text><path d="M290 181 L325 181" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 181 L610 181" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="250" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="56" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Failure drill</text><rect x="325" y="247" width="250" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="341" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Remove one test</text><text x="341" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">replica</text><rect x="610" y="247" width="250" height="90" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="626" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Observe endpoint</text><text x="626" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">and recovery</text><text x="626" y="321" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">delay</text><path d="M290 291 L325 291" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 291 L610 291" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="357" width="250" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="56" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Traffic drill</text><rect x="325" y="357" width="250" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="341" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Increase demand</text><text x="341" y="407" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">gradually</text><rect x="610" y="357" width="250" height="90" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="626" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Measure Pod /</text><text x="626" y="407" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">node readiness</text><text x="626" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">lag</text><path d="M290 401 L325 401" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 401 L610 401" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="467" width="250" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="56" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Recovery drill</text><rect x="325" y="467" width="250" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="341" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Restore into</text><text x="341" y="517" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">isolated</text><text x="341" y="541" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">environment</text><rect x="610" y="467" width="250" height="90" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="626" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Measure RPO /</text><text x="626" y="517" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">RTO +</text><text x="626" y="541" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">correctness</text><path d="M290 511 L325 511" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 511 L610 511" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="579" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">A passed demonstration is evidence for its tested conditions, not a universal guarantee.</text></svg>