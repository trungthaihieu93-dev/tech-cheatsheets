<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" role="img"><title>Desired state is a promise to keep</title><desc>A replacement Pod is a new object, not a resurrection of the old process.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="508" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">Desired state is a promise to keep</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">A replacement Pod is a new object, not a resurrection of the old process.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="45" y="130" width="240" height="100" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="61" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Declare 3</text><text x="61" y="180" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">replicas</text><text x="61" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Deployment spec</text><rect x="330" y="130" width="240" height="100" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2"/><text x="346" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Observe 2</text><text x="346" y="180" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">replicas</text><text x="346" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">One Pod disappeared</text><rect x="615" y="130" width="240" height="100" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="631" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Create</text><text x="631" y="180" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">replacement</text><text x="631" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">ReplicaSet reconciles</text><path d="M285 180 L330 180" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 180 L615 180" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="310" width="480" height="100" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="226" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Schedule + start + become ready</text><text x="226" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Placement, image pull and startup take time.</text><path d="M730 230 L690 325" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210 360 L170 230" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="69.0" y="276" width="106.0" height="25" fill="#FFFEF7"/><text x="122" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18202A" text-anchor="middle">re-observe</text><rect x="36" y="435" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="463" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Convergence needs healthy APIs, free capacity, networking and dependencies.</text></svg>