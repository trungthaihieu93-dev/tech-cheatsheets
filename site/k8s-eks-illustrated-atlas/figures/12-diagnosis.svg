<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" role="img"><title>12 / From a symptom to the next useful check</title><desc>This is a diagnostic decision map, not a catalogue of every possible cause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="695" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">12 / From a symptom to the next useful check</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">This is a diagnostic decision map, not a catalogue of every possible cause.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="139" width="250" height="98" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="56" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Pod Pending</text><rect x="325" y="139" width="250" height="98" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="341" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Read scheduling</text><text x="341" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">events</text><rect x="610" y="139" width="250" height="98" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="626" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Requests, taints,</text><text x="626" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">affinity, IPs, PVC</text><path d="M290 187 L325 187" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 187 L610 187" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="258" width="250" height="98" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="56" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">CrashLoopBackOff</text><rect x="325" y="258" width="250" height="98" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="341" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Read previous</text><text x="341" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">logs + exit state</text><rect x="610" y="258" width="250" height="98" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="626" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Bad config,</text><text x="626" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">startup failure,</text><text x="626" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">OOM</text><path d="M290 306 L325 306" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 306 L610 306" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="377" width="250" height="98" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="56" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">HTTP 503 /</text><text x="56" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">timeout</text><rect x="325" y="377" width="250" height="98" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="341" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Check endpoints</text><text x="341" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">and health</text><rect x="610" y="377" width="250" height="98" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="626" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Readiness, target</text><text x="626" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">health, DNS,</text><text x="626" y="451" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">policy</text><path d="M290 425 L325 425" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 425 L610 425" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="496" width="250" height="98" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="56" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Latency rises</text><rect x="325" y="496" width="250" height="98" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="341" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Trace the request</text><text x="341" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">+ saturation</text><rect x="610" y="496" width="250" height="98" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="626" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">CPU throttling,</text><text x="626" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">event loop, DB</text><text x="626" y="570" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">pool</text><path d="M290 544 L325 544" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 544 L610 544" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="622" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Gather events, logs, metrics and traces before adding replicas or restarting everything.</text></svg>