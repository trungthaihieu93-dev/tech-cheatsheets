<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 613" role="img"><title>09 / Three probes, three different decisions</title><desc>A green process is not necessarily ready to serve useful requests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="613" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">09 / Three probes, three different decisions</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">A green process is not necessarily ready to serve useful requests.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="135" width="245" height="165" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="56" y="161" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Startup</text><text x="56" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Have I initialized?</text><text x="56" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Protect slow boot from</text><text x="56" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">liveness / readiness</text><text x="56" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">checks.</text><rect x="328" y="135" width="245" height="165" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="344" y="161" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Readiness</text><text x="344" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Can I serve now?</text><text x="344" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Remove from normal</text><text x="344" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">ready Service</text><text x="344" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">endpoints when false.</text><rect x="615" y="135" width="245" height="165" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2"/><text x="631" y="161" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Liveness</text><text x="631" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Should I restart?</text><text x="631" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Failure threshold</text><text x="631" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">triggers container</text><text x="631" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">restart.</text><path d="M285 217 L328 217" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="282.3" y="189.0" width="48.4" height="25" fill="#FFFEF7"/><text x="306.5" y="207.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18202A" text-anchor="middle">pass</text><rect x="170" y="380" width="560" height="115" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="186" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Database outage: avoid a restart storm</text><text x="186" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Use dependency-aware readiness deliberately. A local</text><text x="186" y="459" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">liveness check should detect a stuck process.</text><path d="M450 300 L450 380" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="540" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="568" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Probe design is application-specific; restarting does not repair a failed dependency.</text></svg>