<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img"><title>10 / Replicas and nodes are separate loops</title><desc>HPA cannot create EC2 instances; a node scaler does not choose the right app metric.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="650" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">10 / Replicas and nodes are separate loops</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">HPA cannot create EC2 instances; a node scaler does not choose the right app metric.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="137" width="250" height="105" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="56" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18202A" text-anchor="start">Demand + metrics</text><text x="56" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18202A" text-anchor="start">CPU / requests / queue</text><text x="56" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18202A" text-anchor="start">age</text><rect x="325" y="137" width="250" height="105" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="341" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">HPA</text><text x="341" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Adjust Deployment</text><text x="341" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">replicas</text><rect x="610" y="137" width="250" height="105" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="626" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">New Pods</text><text x="626" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Scheduler tries</text><text x="626" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">placement</text><path d="M290 190 L325 190" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 190 L610 190" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="370" width="250" height="115" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2"/><text x="626" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Unschedulable</text><text x="626" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Pods</text><text x="626" y="449" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Resource / topology</text><text x="626" y="473" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">needs</text><rect x="325" y="370" width="250" height="115" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="341" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Node provisioning</text><text x="341" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Karpenter / Auto Mode</text><rect x="40" y="370" width="250" height="115" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="56" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Capacity available</text><text x="56" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">EC2 node joins cluster</text><path d="M735 242 L735 370" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610 427 L575 427" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M325 427 L290 427" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="548" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Illustrative HPA math: ceil(3 × 90 / 60) = 5 desired replicas.</text><text x="50" y="628" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18202A" text-anchor="start">Real HPA behavior also includes tolerances, missing metrics, readiness and stabilization.</text></svg>