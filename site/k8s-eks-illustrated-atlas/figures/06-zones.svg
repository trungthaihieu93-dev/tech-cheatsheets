<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img"><title>A disk can pin a Pod to a zone</title><desc>EBS is zonal block storage; plan placement and recovery accordingly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="511" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">A disk can pin a Pod to a zone</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">EBS is zonal block storage; plan placement and recovery accordingly.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="125" width="365" height="260" rx="20" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 5"/><text x="56" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">AZ A</text><rect x="495" y="125" width="365" height="260" rx="20" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 5"/><text x="511" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">AZ B</text><rect x="75" y="184" width="290" height="100" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="91" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Pod A + EBS volume</text><text x="91" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Matching zone topology</text><rect x="532" y="184" width="290" height="100" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2"/><text x="548" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Replacement Pod</text><text x="548" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Cannot just mount AZ A disk</text><path d="M365 234 L532 234" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="385.4" y="200" width="125.19999999999999" height="25" fill="#FFFEF7"/><text x="448" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18202A" text-anchor="middle">not portable</text><rect x="36" y="415" width="828" height="76" rx="10" fill="#FEF9C3"/><text x="50" y="443" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Recovery may require data replication or restoring into a new zone, not only</text><text x="50" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">rescheduling.</text></svg>