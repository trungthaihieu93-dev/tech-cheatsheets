<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" role="img"><title>04 / Managed does not mean ownerless</title><desc>Ownership changes with the compute mode. Application responsibility stays.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="659" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">04 / Managed does not mean ownerless</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Ownership changes with the compute mode. Application responsibility stays.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="139" width="235" height="85" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="56" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Standard EKS</text><rect x="310" y="139" width="265" height="85" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="326" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Kubernetes control</text><text x="326" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">plane</text><rect x="610" y="139" width="250" height="85" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="626" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Workloads + data</text><text x="626" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">+ selected</text><text x="626" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">add-ons</text><rect x="40" y="245" width="235" height="85" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="56" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Managed node</text><text x="56" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">groups</text><rect x="310" y="245" width="265" height="85" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="326" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">EC2 node lifecycle</text><text x="326" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">tooling</text><rect x="610" y="245" width="250" height="85" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="626" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Node release</text><text x="626" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">rollout + policies</text><rect x="40" y="351" width="235" height="85" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="56" y="377" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Auto Mode</text><rect x="310" y="351" width="265" height="85" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="326" y="377" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Nodes + network +</text><text x="326" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">LB + block storage</text><rect x="610" y="351" width="250" height="85" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="626" y="377" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Workload</text><text x="626" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">constraints +</text><text x="626" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">resilience</text><rect x="40" y="457" width="235" height="85" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="56" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Fargate</text><rect x="310" y="457" width="265" height="85" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="326" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Per-Pod compute</text><text x="326" y="507" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">infrastructure</text><rect x="610" y="457" width="250" height="85" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="626" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Compatible Pods</text><text x="626" y="507" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">+ permissions</text><text x="310" y="117" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">AWS manages</text><text x="610" y="117" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">Your team designs</text><rect x="36" y="586" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="614" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Managed node groups simplify updates; they do not write your availability policy.</text></svg>