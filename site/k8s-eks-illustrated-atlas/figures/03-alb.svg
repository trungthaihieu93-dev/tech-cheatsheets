<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" role="img"><title>ALB control path ≠ request path</title><desc>This example uses ALB IP targets on standard EKS.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="625" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">ALB control path ≠ request path</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">This example uses ALB IP targets on standard EKS.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="45" y="140" width="240" height="110" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="61" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Ingress + Service</text><text x="61" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Desired routing and</text><text x="61" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">backend selection</text><rect x="330" y="140" width="240" height="110" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="346" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">AWS LB</text><text x="346" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Controller</text><text x="346" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Reconcile AWS</text><text x="346" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">resources</text><rect x="615" y="140" width="240" height="110" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="631" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">ALB + target</text><text x="631" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">group</text><text x="631" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Configuration</text><path d="M285 193 L330 193" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M570 193 L615 193" fill="none" stroke="#18202A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="45" y="380" width="240" height="110" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="61" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">External client</text><text x="61" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">HTTPS request</text><rect x="330" y="380" width="240" height="110" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="346" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">ALB</text><text x="346" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">TLS / HTTP routing</text><rect x="615" y="380" width="240" height="110" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="631" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Pod I