<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" role="img"><title>06 / Ask for storage, then mount it</title><desc>Dynamic provisioning example: the StorageClass selects the driver and policy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="574" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">06 / Ask for storage, then mount it</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Dynamic provisioning example: the StorageClass selects the driver and policy.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="40" y="140" width="235" height="100" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="56" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Pod volume</text><text x="56" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Use a PVC</text><rect x="330" y="140" width="235" height="100" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="346" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">PVC</text><text x="346" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Request storage</text><rect x="620" y="140" width="235" height="100" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="636" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#18202A" text-anchor="start">StorageClass + CSI</text><text x="6