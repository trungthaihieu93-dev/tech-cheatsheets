<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" role="img"><title>Requests are placement inputs; limits are ceilings</title><desc>One illustrative container: 250m CPU request, 1000m limit; 256Mi memory request.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="528" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">Requests are placement inputs; limits are ceilings</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">One illustrative container: 250m CPU request, 1000m limit; 256Mi memory request.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="45" y="150" width="245" height="160" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="61" y="176" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Scheduler</text><text x="61" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Checks requested</text><text x="61" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">resources against node</text><text x="61" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">allocatable capacity.</text><rect x="328" y="150" width="245" height="160" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2"/><text x="344" y="176" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Runtime</text><text x="344" y="200" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">enforcement</text><text x="344" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">CPU can be throttled.</text><text x="344" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Memory-limit pressure</text><text x="344" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">can cause OOM</text><text x="344" y="301" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">termination.</text><rect x="615" y="150" width="245" height="160" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="631" y="176" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Autoscaling</text><text x="631" y="200" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">signal</text><text x="631" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">CPU utilization is</text><text x="631" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">measured relative to</text><text x="631" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">the CPU request.</text><rect x="36" y="365" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="393" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">100m actual CPU / 250m request = 40% utilization for that container.</text><text x="50" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A">A request is not an exclusive CPU reservation, and memory requests are not preallocated</text><text x="50" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A">RAM.</text></svg>