<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" role="img"><title>Budget the whole platform</title><desc>Prices below are the published cluster support charges, not a workload quote.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="672" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">Budget the whole platform</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Prices below are the published cluster support charges, not a workload quote.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="45" y="126" width="810" height="76" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="61" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Cluster support</text><text x="61" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Standard: $0.10/h; extended: $0.60/h</text><rect x="45" y="217" width="810" height="76" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="61" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Compute + mode</text><text x="61" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">EC2 / Fargate, Auto Mode fees where applicable</text><rect x="45" y="308" width="810" height="76" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="61" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Network</text><text x="61" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Load balancers, NAT, addresses and data transfer</text><rect x="45" y="399" width="810" height="76" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="61" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Storage + database</text><text x="61" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Volumes, snapshots, managed DB, document storage</text><rect x="45" y="490" width="810" height="76" rx="15" fill="#FFE4E6" stroke="#18202A" stroke-width="2"/><text x="61" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Operations</text><text x="61" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Logs, metrics, tooling and engineering time</text><rect x="36" y="599" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="627" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Illustrative 730-hour month: $73 standard / $438 extended, before other charges.</text></svg>