<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" role="img"><title>11 / Isolation is a stack, not a namespace label</title><desc>Use controls matched to the trust boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18202A"/></marker></defs><rect width="900" height="649" rx="22" fill="#FFFEF7"/><text x="36" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">11 / Isolation is a stack, not a namespace label</text><text x="36" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Use controls matched to the trust boundary.</text><path d="M36 52 Q270 59 560 52" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="65" y="128" width="770" height="85" rx="15" fill="#DBEAFE" stroke="#18202A" stroke-width="2"/><text x="81" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Business data</text><text x="81" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Tenant-scoped queries and authorization</text><rect x="65" y="238" width="770" height="85" rx="15" fill="#FEF9C3" stroke="#18202A" stroke-width="2"/><text x="81" y="264" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Kubernetes API</text><text x="81" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Least-privilege RBAC; admission policy</text><rect x="65" y="348" width="770" height="85" rx="15" fill="#DCFCE7" stroke="#18202A" stroke-width="2"/><text x="81" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Pod networking</text><text x="81" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Enforced NetworkPolicy + required allow paths</text><rect x="65" y="458" width="770" height="85" rx="15" fill="#F3E8FF" stroke="#18202A" stroke-width="2"/><text x="81" y="484" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18202A" text-anchor="start">Compute boundary</text><text x="81" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">Harden nodes; isolate stronger-trust workloads</text><rect x="36" y="576" width="828" height="53" rx="10" fill="#FEF9C3"/><text x="50" y="604" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#18202A" text-anchor="start">A namespace does not encrypt records, isolate kernels or enforce product authorization.</text></svg>