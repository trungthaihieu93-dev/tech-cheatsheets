# Illustrative review specimen; NOT deployed or verified against a live EKS cluster.
# Replace the image, implement all endpoints, and validate your cluster compatibility.
apiVersion: v1
kind: Namespace
metadata:
  name: insurance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quote-api
  namespace: insurance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes
  namespace: insurance
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quotes
  template:
    metadata:
      labels:
        app: quotes
    spec:
      serviceAccountName: quote-api
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: quotes
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: quotes
      containers:
        - name: api
          image: REPLACE_WITH_YOUR_IMAGE_REFERENCE
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quotes
  namespace: insurance
spec:
  selector:
    app: quotes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quotes
  namespace: insurance
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: quotes
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quotes
  namespace: insurance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quotes
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
